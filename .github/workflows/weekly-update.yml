name: Weekly data update

on:
  schedule:
    # Every Sunday at 09:00 UTC. Cron is always in UTC on GitHub Actions.
    - cron: "0 9 * * 0"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Download data
        run: uv run python download.py

      - name: Compile results.json
        run: uv run python compile.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data results.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly data update: $(date -u +%Y-%m-%d)"
            git push
          fi
