name = "us-debt-feedback"
main = "src/index.js"
compatibility_date = "2024-09-01"
workers_dev = false
preview_urls = false

# Custom domain that serves this Worker.
routes = [
  { pattern = "bot.usdebt.watch", custom_domain = true },
]

# Secrets are set out-of-band, never committed:
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET

# Durable Object holding all threads and message mappings. Unlike KV, a DO
# provides strong read-after-write consistency, so a reply appears on the very
# next poll instead of after KV's eventual-consistency lag.
[[durable_objects.bindings]]
name = "FEEDBACK_STORE"
class_name = "FeedbackStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FeedbackStore"]

# Native rate limiter for feedback submissions (POST /). Keyed per visitor id
# (or client IP when the id is missing/invalid). Allow up to 5 submissions per
# 10-second window; further requests get a 429 until the window rolls over.
[[ratelimits]]
name = "SUBMIT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 10 }
