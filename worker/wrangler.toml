name = "us-debt-feedback"
main = "src/index.js"
compatibility_date = "2024-09-01"
workers_dev = false
preview_urls = false

# Custom domain that serves this Worker.
routes = [
  { pattern = "bot.usdebt.watch", custom_domain = true },
]

# Secrets are set out-of-band, never committed:
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET

# KV namespace for tickets/replies. Create it with:
#   wrangler kv namespace create FEEDBACK
# then paste the printed id below.
[[kv_namespaces]]
binding = "FEEDBACK"
id = "ff40f44cc13b436bbfb0fb80a8a8b1dd"
